<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio editor</title>
<link rel="stylesheet" href="../shared/overlays.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header id="toolbar">
  <label class="btn">Open PDF<input type="file" id="pdf-input" accept="application/pdf" hidden></label>
  <button id="open-folder" type="button">Open book folder</button>
  <button id="undo" type="button" disabled aria-label="Undo" title="Undo (Ctrl+Z)">↶</button>
  <button id="redo" type="button" disabled aria-label="Redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <input id="title" placeholder="Book title" aria-label="Book title" disabled>
  <button id="preview" type="button" aria-pressed="false" disabled>Preview</button>
  <button id="export" type="button" disabled>Export…</button>
  <button id="library" type="button" title="Make a page listing every book in a folder">Library…</button>
  <span id="status" role="status"></span>
</header>
<main>
  <nav id="thumbs" aria-label="Pages"></nav>
  <section id="stage">
    <div id="page" hidden><img id="page-img" alt=""><div id="layer" class="fo-layer"></div></div>
  </section>
  <aside id="props"></aside>
</main>
<dialog id="lib-dialog" aria-labelledby="lib-title">
  <form method="dialog">
    <h2 id="lib-title">Build library</h2>
    <p id="lib-found" class="hint"></p>
    <label for="lib-name">Publisher name</label>
    <input id="lib-name" required>
    <label for="lib-intro">Introduction</label>
    <textarea id="lib-intro" rows="3"></textarea>
    <label for="lib-site">Website</label>
    <input id="lib-site" type="url" placeholder="https://">
    <div class="actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="build" class="primary">Build library</button>
    </div>
  </form>
</dialog>
<script src="../shared/model.js"></script>
<script src="../shared/overlays.js"></script>
<script type="module" src="editor.js"></script>
</body>
</html>
