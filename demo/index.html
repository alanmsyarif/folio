<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flipbook</title>
<link rel="stylesheet" href="overlays.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div id="stage"><div id="book"></div></div>
<nav id="bar" aria-label="Book controls">
  <button id="prev" type="button" aria-label="Previous page">‹</button>
  <span id="count" aria-live="polite"></span>
  <button id="next" type="button" aria-label="Next page">›</button>
  <button id="full" type="button">Fullscreen</button>
</nav>
<script src="page-flip.browser.js"></script>
<script src="book.js"></script>
<script src="model.js"></script>
<script src="overlays.js"></script>
<script src="viewer.js"></script>
</body>
</html>
