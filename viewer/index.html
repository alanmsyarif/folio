<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flipbook</title>
<link rel="stylesheet" href="overlays.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div id="stage"><div id="book"></div></div>
<nav id="bar" aria-label="Book controls">
  <button id="first" type="button" aria-label="First page">«</button>
  <button id="prev" type="button" aria-label="Previous page">‹</button>
  <label id="count"><input id="num" type="text" inputmode="numeric" aria-label="Page number"> <span id="total"></span></label>
  <button id="next" type="button" aria-label="Next page">›</button>
  <button id="last" type="button" aria-label="Last page">»</button>
  <input id="seek" type="range" min="1" aria-label="Go to page">
  <!-- Inline on wide screens; on narrow ones a menu behind ⋯ (see viewer.css). -->
  <div id="tools" popover>
    <button id="grid" type="button">Pages</button>
    <button id="zoom" type="button">Zoom</button>
    <button id="find" type="button" hidden>Search</button>
    <button id="share" type="button" hidden>Share</button>
    <button id="full" type="button">Fullscreen</button>
  </div>
  <button id="more" type="button" popovertarget="tools" aria-label="More controls">⋯</button>
</nav>
<dialog id="thumbs" aria-label="All pages">
  <form method="dialog"><button id="thumbs-close">Close</button></form>
  <div id="thumb-list"></div>
</dialog>
<dialog id="finder" aria-label="Search the book">
  <div id="fbar">
    <input id="fq" type="search" placeholder="Search the book" aria-label="Search the book" autocomplete="off">
    <form method="dialog"><button type="submit">Close</button></form>
  </div>
  <p id="fstatus" aria-live="polite"></p>
  <ol id="fresults"></ol>
</dialog>
<dialog id="zoomer" aria-label="Zoomed pages">
  <div id="zbar">
    <button id="zout" type="button" aria-label="Zoom out">−</button>
    <button id="zin" type="button" aria-label="Zoom in">+</button>
    <form method="dialog"><button type="submit">Close</button></form>
  </div>
  <div id="zview"><div id="zpages"></div></div>
</dialog>
<script src="page-flip.browser.js"></script>
<script src="book.js"></script>
<script src="model.js"></script>
<script src="overlays.js"></script>
<script src="viewer.js"></script>
</body>
</html>
